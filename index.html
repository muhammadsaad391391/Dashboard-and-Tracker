<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER — Peak Performance & Life Tracker</title>
  <script>
    function showErrorOverlay(msg, stack) {
      if (document.getElementById('error-overlay')) return;
      var div = document.createElement('div');
      div.id = 'error-overlay';
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = '#ef4444';
      div.style.color = '#ffffff';
      div.style.padding = '20px';
      div.style.zIndex = '99999';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '12px';
      div.style.whiteSpace = 'pre-wrap';
      div.innerText = msg + '\n\n' + (stack || 'N/A');
      document.body.appendChild(div);
    }
    window.setAetherLoaderText = function(text) {
      var el = document.querySelector('.loader-text');
      if (el) el.innerText = text;
    };
    window.addEventListener('error', function(e) {
      showErrorOverlay('Uncaught Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno, e.error ? e.error.stack : '');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason || {};
      showErrorOverlay('Unhandled Promise Rejection: ' + (reason.message || reason), reason.stack || '');
    });
  </script>
  <meta name="description" content="A premium, world-class personal productivity and life-tracking web application. Local-first, private, and beautifully styled.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar-container" class="sidebar-container"></aside>
    
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    
    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Header Info Panel -->
      <header id="header-container" class="header-container"></header>
      
      <!-- Dynamic Main Content Viewport -->
      <main id="view-container" class="view-container"></main>
    </div>
  </div>

  <!-- Loading State Screen -->
  <div id="app-loader" class="app-loader">
    <div class="loader-content" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;">
      <img src="/splash.png" alt="Aether" style="max-height: 100vh; max-width: 100vw; width: auto; height: auto; object-fit: contain; pointer-events: none;">
      <div class="loader-text" style="position: absolute; bottom: 33%; font-family: var(--font-sans); font-size: 13px; color: #64748b; font-weight: 500; text-align: center; width: 100%; letter-spacing: 0.05em;">Initializing Secure Space...</div>
    </div>
  </div>

  <!-- Main script modules -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
