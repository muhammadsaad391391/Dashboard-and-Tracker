<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER — Peak Performance & Life Tracker</title>
  <script>
    function showErrorOverlay(msg, stack) {
      if (document.getElementById('error-overlay')) return;
      var div = document.createElement('div');
      div.id = 'error-overlay';
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = '#ef4444';
      div.style.color = '#ffffff';
      div.style.padding = '20px';
      div.style.zIndex = '99999';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '12px';
      div.style.whiteSpace = 'pre-wrap';
      div.innerText = msg + '\n\n' + (stack || 'N/A');
      document.body.appendChild(div);
    }
    window.setAetherLoaderText = function(text) {
      var el = document.querySelector('.loader-text');
      if (el) el.innerText = text;
    };
    window.addEventListener('error', function(e) {
      showErrorOverlay('Uncaught Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno, e.error ? e.error.stack : '');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason || {};
      showErrorOverlay('Unhandled Promise Rejection: ' + (reason.message || reason), reason.stack || '');
    });
  </script>
  <meta name="description" content="A premium, world-class personal productivity and life-tracking web application. Local-first, private, and beautifully styled.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar-container" class="sidebar-container"></aside>
    
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    
    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Header Info Panel -->
      <header id="header-container" class="header-container"></header>
      
      <!-- Dynamic Main Content Viewport -->
      <main id="view-container" class="view-container"></main>
    </div>
  </div>

  <!-- Loading State Screen -->
  <div id="app-loader" class="app-loader">
    <div class="loader-content">
      <!-- Custom SVG Purple-Blue Gradient Logo -->
      <div class="splash-logo-container">
        <svg class="splash-logo-svg" viewBox="0 0 100 100" width="130" height="130">
          <defs>
            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed" />
              <stop offset="50%" stop-color="#4f46e5" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
          <!-- Geometric Leg A -->
          <path d="M 50 15 L 22 78 A 5 5 0 0 0 27 85 H 37 L 44 68 H 56 L 63 85 H 73 A 5 5 0 0 0 78 78 L 50 15 Z" fill="url(#logo-grad)" />
          <!-- Sleek crossing swoosh -->
          <path d="M 24 72 C 38 52 62 52 76 72 C 62 60 38 60 24 72 Z" fill="#ffffff" opacity="0.95" />
          <!-- Star sparkle in opening -->
          <path d="M 50 58 C 50 61 51 62 52 62 C 51 62 50 63 50 66 C 50 63 49 62 48 62 C 49 62 50 61 50 58 Z" fill="url(#logo-grad)" />
        </svg>
      </div>

      <div class="splash-title">Aether</div>
      <div class="splash-slogan">Plan. Track. Achieve.</div>

      <!-- Pulse Animating Progress Bar -->
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>

      <div class="loader-text">Initializing Secure Space...</div>
    </div>

    <!-- Soft curved wavy vectors at the bottom -->
    <div class="splash-waves">
      <svg viewBox="0 0 1440 320" width="100%" height="100%" preserveAspectRatio="none">
        <path fill="#e0f2fe" fill-opacity="0.6" d="M0,224L120,202.7C240,181,480,139,720,138.7C960,139,1200,181,1320,202.7L1440,224L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"></path>
        <path fill="#ede9fe" fill-opacity="0.8" d="M0,256L120,240C240,224,480,192,720,192C960,192,1200,224,1320,240L1440,256L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"></path>
      </svg>
    </div>
  </div>

  <!-- Main script modules -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
